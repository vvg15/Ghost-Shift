<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ghost Shift</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171e2e;
    --ink: #e8ecf5;
    --dim: #8a94ab;
    --accent: #6fe3ff;
    --btn: #222b40;
    --btn-on: #34405e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #app {
    height: 100%; display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-areas: "hud" "stage" "controls";
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #hud { grid-area: hud; padding: 8px 12px 4px; }
  #hudTop { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  #roomName { font-weight: 700; font-size: 17px; }
  #roomNum { color: var(--dim); font-size: 13px; }
  #ghostCount { margin-left: auto; color: var(--dim); font-size: 13px; }
  #hint { color: var(--dim); font-size: 13px; min-height: 1.35em; margin-top: 2px; }
  #timer { height: 6px; background: #222a3c; border-radius: 3px; margin-top: 6px; overflow: hidden; }
  #timerFill { height: 100%; width: 100%; background: var(--accent); transform-origin: left; }
  #stage { grid-area: stage; position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 4px 8px; }
  canvas { display: block; border-radius: 10px; touch-action: none; }
  #overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(10,14,22,.72); text-align: center; padding: 16px;
  }
  #overlay.show { display: flex; }
  #overlay .card { background: var(--panel); border-radius: 14px; padding: 18px 20px; max-width: 360px; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  #overlay h2 { margin: 0 0 6px; font-size: 22px; }
  #overlay p { margin: 6px 0; color: var(--dim); }
  #overlay button { margin-top: 10px; }
  #controls {
    grid-area: controls; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 8px 16px 14px;
  }
  .btn {
    appearance: none; border: 0; border-radius: 12px; background: var(--btn); color: var(--ink);
    font: 600 15px system-ui, sans-serif; min-height: 52px; min-width: 52px; padding: 0 14px;
    touch-action: manipulation; cursor: pointer;
  }
  .btn:active, .btn.on { background: var(--btn-on); }
  .btn.primary { background: #1d6f86; }
  .btn.primary:active { background: #24879f; }
  #actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #actions .btn.wide { grid-column: span 2; }
  #pad {
    position: relative; width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #263049 0 28%, #1b2336 29% 100%);
    touch-action: none; flex: none;
  }
  #pad .arrow { position: absolute; width: 0; height: 0; border: 11px solid transparent; opacity: .55; }
  #pad .up { left: 64px; top: 12px; border-bottom-color: var(--ink); border-top-width: 0; }
  #pad .down { left: 64px; bottom: 12px; border-top-color: var(--ink); border-bottom-width: 0; }
  #pad .left { top: 64px; left: 12px; border-right-color: var(--ink); border-left-width: 0; }
  #pad .right { top: 64px; right: 12px; border-left-color: var(--ink); border-right-width: 0; }
  #knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: #3a4766; pointer-events: none; }
  #keys { color: var(--dim); font-size: 12px; margin-top: 2px; }
  /* Keyboard-first devices: smaller pad */
  @media (hover: hover) and (pointer: fine) {
    #pad { width: 120px; height: 120px; }
    #pad .up, #pad .down { left: 49px; } #pad .left, #pad .right { top: 49px; }
  }
  /* Phones in landscape: pad left, stage middle, actions right */
  @media (orientation: landscape) and (max-height: 560px) {
    #app {
      grid-template-columns: auto 1fr auto;
      grid-template-rows: auto 1fr;
      grid-template-areas: "padcol hud actcol" "padcol stage actcol";
    }
    #controls { display: contents; }
    #pad { grid-area: padcol; align-self: end; margin: 0 8px 18px 14px; width: 140px; height: 140px; }
    #pad .up, #pad .down { left: 59px; } #pad .left, #pad .right { top: 59px; }
    #actions { grid-area: actcol; align-self: end; margin: 0 14px 18px 8px; grid-template-columns: 1fr; }
    #actions .btn.wide { grid-column: auto; }
    #hud { padding: 6px 8px 2px; }
    #hint { display: none; }
    #keys { display: none; }
  }
  @media (hover: none) { #keys { display: none; } }
  #hudTop .spacer { margin-left: auto; }
  #hudRow2 { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  #hudRow2 #par { flex: 1; }
  #bLevels { min-height: 34px; min-width: 0; padding: 0 12px; font-size: 14px; border-radius: 10px; }
  #par { color: var(--dim); font-size: 13px; }
  #overlay .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  #overlay .row .btn { margin-top: 0; }
  .star { color: #ffd166; }
  /* Level select */
  #levels {
    position: fixed; inset: 0; display: none; z-index: 10; background: rgba(10,14,22,.94);
    padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 16px);
    flex-direction: column; align-items: center;
  }
  #levels.show { display: flex; }
  #levels .head { width: 100%; max-width: 520px; display: flex; align-items: center; gap: 8px; }
  #levels h2 { margin: 0; font-size: 20px; flex: 1; }
  #levels .sum { width: 100%; max-width: 520px; color: var(--dim); font-size: 13px; margin: 6px 0 10px; }
  #lvGrid {
    width: 100%; max-width: 520px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    overflow-y: auto; align-content: start; flex: 1; min-height: 0; padding-bottom: 4px;
  }
  @media (min-width: 420px) { #lvGrid { grid-template-columns: repeat(6, 1fr); } }
  .lv {
    appearance: none; border: 0; border-radius: 12px; background: var(--btn); color: var(--ink);
    aspect-ratio: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font: 700 18px system-ui, sans-serif; cursor: pointer; touch-action: manipulation; position: relative;
  }
  .lv small { font-size: 11px; font-weight: 600; color: var(--dim); margin-top: 2px; }
  .lv.done { background: #1f3b3a; }
  .lv.done small { color: #7fe3c0; }
  .lv.star small { color: #ffd166; }
  .lv.locked { background: #161c2a; color: #4a5470; cursor: default; }
  .lv.current { outline: 2px solid var(--accent); outline-offset: 1px; }
  #lvPager { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  #lvPager span { color: var(--dim); font-size: 14px; min-width: 110px; text-align: center; }
  #lvPager .btn:disabled { opacity: .35; }
  @media (orientation: landscape) and (max-height: 560px) {
    #lvGrid { grid-template-columns: repeat(10, 1fr); max-width: 760px; }
    #levels .head, #levels .sum { max-width: 760px; }
    .lv { aspect-ratio: auto; min-height: 48px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="hudTop">
      <span id="roomName">Ghost Shift</span>
      <span id="roomNum"></span>
      <span id="ghostCount" class="spacer"></span>
    </div>
    <div id="hudRow2"><span id="par"></span><button class="btn" id="bLevels" aria-label="Level select">☰ Levels</button></div>
    <div id="hint"></div>
    <div id="keys">Move: arrows / WASD · Next loop: Space or R · Undo ghost: Z · Reset level: Backspace · Levels: L · Prev / next: [ and ]</div>
    <div id="timer"><div id="timerFill"></div></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="overlay"><div class="card" id="card"></div></div>
  </div>
  <div id="controls">
    <div id="pad" aria-label="Move">
      <span class="arrow up"></span><span class="arrow down"></span>
      <span class="arrow left"></span><span class="arrow right"></span>
      <div id="knob"></div>
    </div>
    <div id="actions">
      <button class="btn primary wide" id="bLoop" aria-label="End this loop and start the next">⟲ Next loop</button>
      <button class="btn" id="bUndo" aria-label="Remove the last ghost">Undo ghost</button>
      <button class="btn" id="bReset" aria-label="Clear all ghosts in this level">Reset</button>
    </div>
  </div>
</div>
<div id="levels" role="dialog" aria-label="Level select">
  <div class="head"><h2>Levels</h2><button class="btn" id="lvClose">Close</button></div>
  <div class="sum" id="lvSum"></div>
  <div id="lvGrid"></div>
  <div id="lvPager"><button class="btn" id="lvPrev" aria-label="Previous page">‹</button><span id="lvPage"></span><button class="btn" id="lvNext" aria-label="Next page">›</button></div>
</div>

<script src="engine.js"></script>
<script src="solver.js"></script>
<script src="levels.js"></script>
<script src="generator.js"></script>
<script src="game.js"></script>
</body>
</html>
